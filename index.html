  <div id="consent-banner" style="display:none;position:fixed;bottom:0;left:0;right:0;padding:1rem;background:#222;color:#fff;">
    We use cookies for analytics and ads.
    <button id="accept-all">Accept all</button>
    <button id="reject-all">Reject all</button>

  <script>
    function saveConsent(granted) {
      var consent = {
        adConsentGranted: granted,
        adUserDataConsentGranted: granted,
        adPersonalizationConsentGranted: granted,
        analyticsConsentGranted: granted,
        functionalityConsentGranted: granted,
        personalizationConsentGranted: granted,
        securityConsentGranted: true
      };
      // Cookie name must match COOKIE_NAME ('cookies') in the template
      document.cookie = 'cookies=' + encodeURIComponent(JSON.stringify(consent)) +
        ';max-age=31536000;path=/;SameSite=Lax';
      consentCallbacks.forEach(function (cb) { cb(consent); });
      document.getElementById('consent-banner').style.display = 'none';
    }

    if (document.cookie.indexOf('cookies=') === -1) {
      document.getElementById('consent-banner').style.display = 'block';
    }
    document.getElementById('accept-all').onclick = function () { saveConsent(true); };
    document.getElementById('reject-all').onclick = function () { saveConsent(false); };
  </script>
